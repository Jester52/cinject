<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel de Administración - Cinyect</title>
    <style>
        :root { --bg: #121212; --card: #1e1e1e; --text: #e0e0e0; --accent: #bb86fc; --danger: #cf6679; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); padding: 40px; margin: 0; }
        .container { max-width: 800px; margin: auto; }
        h1 { border-bottom: 2px solid var(--accent); padding-bottom: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: var(--card); border-radius: 8px; overflow: hidden; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #333; }
        th { background: #252525; color: var(--accent); }
        .btn { padding: 8px 16px; border-radius: 4px; border: none; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn-view { background: var(--accent); color: #000; }
        .btn-del { background: var(--danger); color: white; margin-left: 10px; }
        .btn:hover { opacity: 0.8; transform: scale(1.05); }
    </style>
</head>
<body>

<div class="container">
    <h1>Panel de Control Maestro</h1>
    <table>
        <thead>
            <tr><th>Sala ID</th><th>Fecha Creación</th><th>Acciones</th></tr>
        </thead>
        <tbody id="lista-salas">
            </tbody>
    </table>
</div>

<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
<script>
    const firebaseConfig = { /* PON AQUÍ TU CONFIGuración COMPLETA */ };
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    database.ref('salas_activas').on('value', (snapshot) => {
        const tbody = document.getElementById('lista-salas');
        tbody.innerHTML = '';
        snapshot.forEach((child) => {
            const data = child.val();
            const sala = child.key;
            const fecha = new Date(data.creado).toLocaleDateString();
            
            tbody.innerHTML += `<tr>
                <td><strong>${sala}</strong></td>
                <td>${fecha}</td>
                <td>
                    <button class="btn btn-view" onclick="verSala('${sala}')">Monitorear</button>
                    <button class="btn btn-del" onclick="eliminarSala('${sala}')">Eliminar</button>
                </td>
            </tr>`;
        });
    });

    function eliminarSala(id) {
        if(confirm("¿Estás seguro de eliminar la sala: " + id + "?")) {
            database.ref('salas_activas/' + id).remove();
            database.ref('usuarios/' + id).remove();
        }
    }

    function verSala(id) { window.open('m.html?id=' + id, '_blank'); }
</script>
</body>
</html>
